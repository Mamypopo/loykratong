<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ลอยกระทงด้วยกัน</title>
  <meta name="description" content="เขียนคำอธิษฐาน ลอยกระทงออนไลน์ แล้วดูกระทงของเพื่อนๆ ลอยผ่านไปในแม่น้ำเดียวกัน">
  <meta property="og:title" content="ลอยกระทงด้วยกัน">
  <meta property="og:description" content="เขียนคำอธิษฐาน ลอยกระทงออนไลน์ แล้วดูกระทงของเพื่อนๆ ลอยผ่านไปในแม่น้ำเดียวกัน">
  <meta property="og:image" content="/semed-logo.png">
  <meta name="theme-color" content="#0d1a3a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🪷%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@700&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0d1a3a;      /* sky over the river */
      --water: #0a2a4a;      /* river surface */
      --moon: #f3e6c4;       /* moonlight, main text */
      --candle: #ffc56b;     /* flame, primary action */
      --leaf: #3f8a5a;       /* banana leaf */
      --lotus: #f29bb8;      /* lotus petals */
      --muted: #a9b6d3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100svh; color: var(--moon); font: 300 17px/1.6 "Mitr", "Noto Sans Thai", system-ui, sans-serif;
      background: linear-gradient(180deg, #070f26 0%, var(--night) 48%, var(--water) 58%, #06182d 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    /* moon reflection on the water */
    body::before {
      content: ""; position: fixed; left: 78%; top: 58%; width: 120px; height: 42%; transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, rgba(243, 230, 196, .16) 0 3px, transparent 3px 11px);
      -webkit-mask: linear-gradient(180deg, #000, transparent); mask: linear-gradient(180deg, #000, transparent);
      pointer-events: none;
    }
    body.is-screen main, body.is-screen .moon { display: none; }
    /* the scene's own moon (drawn by LoyKrathongEasterEgg.drawMoon); on "go" a copy flies onto the 3D moon */
    .moon {
      position: fixed; left: 78%; top: 14%; width: clamp(84px, 13vw, 170px); aspect-ratio: 1; transform: translate(-50%, -50%);
      border-radius: 50%; box-shadow: 0 0 50px 14px rgba(255, 228, 160, .28), 0 0 160px 50px rgba(183, 156, 255, .12);
      pointer-events: none;
    }
    .moon canvas { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .moon.flying { left: 0; top: 0; z-index: 2147483600; transform-origin: 50% 50%; will-change: transform, opacity; }
    main > * { transition: opacity .5s ease, transform .5s ease; }
    body.leaving main > * { opacity: 0; transform: translateY(14px); }

    main {
      position: relative; min-height: 100svh; display: grid; grid-template-rows: 1fr auto 1fr;
      justify-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .sky { align-self: end; max-width: 30ch; }
    h1 {
      margin: 0; font: 700 clamp(44px, 12vw, 84px)/1.15 "Charmonman", "Mitr", serif; color: var(--moon);
      text-shadow: 0 0 28px rgba(255, 197, 107, .35);
    }
    .lead { margin: 10px auto 0; color: var(--muted); max-width: 30ch; }

    /* the krathong sitting on the waterline: the one decorative element on the page */
    .krathong { position: relative; width: 150px; height: 118px; margin: 26px 0 10px; }
    .krathong .base {
      position: absolute; left: 0; right: 0; bottom: 8px; height: 46px; border-radius: 0 0 75px 75px / 0 0 46px 46px;
      background: repeating-conic-gradient(from 90deg at 50% 0, var(--leaf) 0 9deg, #2f6e47 9deg 18deg);
      box-shadow: inset 0 6px 0 rgba(255, 255, 255, .12);
    }
    .krathong .petal {
      position: absolute; bottom: 44px; width: 34px; height: 46px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      background: linear-gradient(180deg, #ffd6e4, var(--lotus)); transform-origin: 50% 100%;
    }
    .krathong .p1 { left: 22px; transform: rotate(-28deg); }
    .krathong .p2 { left: 58px; height: 52px; }
    .krathong .p3 { right: 22px; transform: rotate(28deg); }
    .krathong .candle { position: absolute; left: 71px; bottom: 82px; width: 8px; height: 22px; border-radius: 2px; background: #fff4dc; }
    .krathong .flame {
      position: absolute; left: 68px; bottom: 102px; width: 14px; height: 20px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      background: radial-gradient(circle at 50% 70%, #fff 0 20%, var(--candle) 45%, rgba(255, 140, 50, .0) 72%);
      filter: drop-shadow(0 0 12px rgba(255, 197, 107, .9)); animation: flicker 2.4s ease-in-out infinite;
    }
    .krathong .ripple {
      position: absolute; left: -30px; right: -30px; bottom: 0; height: 16px; border-radius: 50%;
      border: 1.5px solid rgba(243, 230, 196, .25); animation: ripple 4s ease-out infinite;
    }
    @keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 45% { transform: scale(1.08, .94) rotate(3deg); } 70% { transform: scale(.95, 1.06) rotate(-1deg); } }
    @keyframes ripple { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }

    form { width: 100%; max-width: 360px; align-self: start; }
    label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 8px; }
    input {
      width: 100%; font: 400 19px/1.4 "Mitr", "Noto Sans Thai", system-ui, sans-serif; color: var(--moon); text-align: center;
      padding: 13px 16px; border-radius: 14px; border: 1.5px solid rgba(243, 230, 196, .35);
      background: rgba(6, 24, 45, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    input::placeholder { color: rgba(169, 182, 211, .7); }
    button {
      margin-top: 14px; width: 100%; font: 500 19px/1.3 "Mitr", "Noto Sans Thai", system-ui, sans-serif; color: #2a1600; cursor: pointer;
      padding: 14px 18px; border: 0; border-radius: 999px; background: var(--candle);
      box-shadow: 0 0 0 0 rgba(255, 197, 107, .5), 0 8px 26px rgba(255, 170, 70, .35);
    }
    button:hover { background: #ffd387; }
    button:active { transform: translateY(1px); }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }
    .fine { margin: 14px 0 0; font-size: 14px; color: var(--muted); }

    /* big-screen corner: QR to join + running total */
    .join {
      position: fixed; z-index: 2147483100; right: max(24px, env(safe-area-inset-right)); bottom: 28px;
      display: flex; align-items: center; gap: 18px; padding: 16px 22px 16px 16px; border-radius: 20px;
      background: rgba(7, 15, 38, .72); border: 1.5px solid rgba(243, 230, 196, .28);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--moon); text-align: left;
    }
    .join .qr { width: clamp(120px, 11vw, 190px); aspect-ratio: 1; background: #fff; border-radius: 10px; padding: 8px; }
    .join .qr svg { display: block; width: 100%; height: 100%; }
    .join p { margin: 0; }
    .join .scan { font-size: clamp(18px, 1.6vw, 28px); font-weight: 500; }
    .join .url { font-size: clamp(14px, 1.1vw, 18px); color: var(--muted); }
    .join .count { margin-top: 10px; font-size: clamp(16px, 1.4vw, 24px); }
    .join .count b { font-weight: 500; color: var(--candle); font-size: 1.5em; }

    @media (prefers-reduced-motion: reduce) { .krathong .flame, .krathong .ripple { animation: none; } }
  </style>
</head>
<body>
  <div class="moon" id="moon" aria-hidden="true"><canvas width="360" height="360"></canvas></div>
  <main>
    <div class="sky">
      <h1>ลอยกระทงด้วยกัน</h1>
      <p class="lead">เขียนชื่อของคุณ แล้วไปลอยกระทงพร้อมคำอธิษฐาน เพื่อนๆ จะเห็นกระทงของคุณลอยผ่านไปในแม่น้ำเดียวกัน</p>
    </div>
    <div class="krathong" aria-hidden="true">
      <span class="ripple"></span><span class="base"></span>
      <span class="petal p1"></span><span class="petal p3"></span><span class="petal p2"></span>
      <span class="candle"></span><span class="flame"></span>
    </div>
    <form id="start" autocomplete="on">
      <label for="name">ชื่อที่จะแสดงบนกระทง</label>
      <input type="text" id="name" name="nickname" maxlength="40" placeholder="เช่น สมใจ" autocomplete="nickname" enterkeyhint="go">
      <button type="submit">ไปลอยกระทง</button>
      <p class="fine" id="note">ไม่ต้องสมัครหรือเข้าสู่ระบบ เว้นชื่อว่างไว้ได้</p>
    </form>
  </main>

  <script src="filter.js"></script>
  <script src="design.js"></script>
  <script src="workshop.js"></script>
  <script src="shelf.js"></script>
  <script src="gallery.js"></script>
  <script src="loykrathong-easter-egg.js"></script>
  <script src="app.js"></script>
</body>
</html>
